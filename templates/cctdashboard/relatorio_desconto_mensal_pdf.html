<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><style>
@page{size:A4;margin:1.5cm}body{font-family:Helvetica,Arial,sans-serif;color:#1e293b;font-size:11px}.header{border-bottom:3px solid #0f4c81;padding-bottom:10px}.header h1{color:#0f4c81;font-size:20px;margin:0}.muted{color:#64748b}table{width:100%;border-collapse:collapse;margin-top:18px}th{background:#0f4c81;color:#fff;text-align:left;padding:8px}td{border:1px solid #cbd5e1;padding:8px}.footer{border-top:1px solid #cbd5e1;margin-top:18px;padding-top:7px;font-size:8px;color:#64748b}</style></head><body>
<div class="header"><h1>Relatório de Descontos</h1><div class="muted">Mês: {{ mes_nome|title }} | Emissão: {{ data_geracao }}</div></div>
<table><thead><tr><th>Nome da empresa</th></tr></thead><tbody>
{% for empresa in empresas_desconto %}<tr><td>{{ empresa.nome }}</td></tr>{% empty %}<tr><td>Nenhuma empresa encontrada.</td></tr>{% endfor %}
</tbody></table><div class="footer">Documento para emissão sindicato/empresa.</div></body></html>
