version: '3.8'

services:
  web:
    build: .
    container_name: buscacct
    ports:
      - "8000:8000"
    volumes:
      - buscacct_data:/app/data
      - buscacct_convencoes:/app/convencoes
      - buscacct_dados:/app/dados
      - buscacct_media:/app/media
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-change-me-in-production}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-*}
      - DJANGO_CSRF_COOKIE_SECURE=${DJANGO_CSRF_COOKIE_SECURE:-True}
      - DJANGO_SESSION_COOKIE_SECURE=${DJANGO_SESSION_COOKIE_SECURE:-True}
    restart: unless-stopped

  scheduler:
    build: .
    container_name: buscacct_scheduler
    command: python manage.py verificar_agendamentos
    volumes:
      - buscacct_data:/app/data
      - buscacct_convencoes:/app/convencoes
      - buscacct_dados:/app/dados
      - buscacct_media:/app/media
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-change-me-in-production}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-*}
    restart: unless-stopped
    depends_on:
      - web

  # Serviço cron: executa scraper + análise às 05:00 todo dia (todos os sindicatos)
  cron:
    build: .
    container_name: buscacct_cron
    command: supercronic /app/crontab
    volumes:
      - buscacct_data:/app/data
      - buscacct_convencoes:/app/convencoes
      - buscacct_dados:/app/dados
      - buscacct_media:/app/media
      - buscacct_logs:/app/logs
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-change-me-in-production}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-*}
      - TZ=America/Sao_Paulo
    restart: unless-stopped
    depends_on:
      - web

volumes:
  buscacct_data:
    driver: local
  buscacct_convencoes:
    driver: local
  buscacct_dados:
    driver: local
  buscacct_media:
    driver: local
  buscacct_logs:
    driver: local